<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f3a"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/styles.css"><title>Sign in — DisasterGuard</title><style>body{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 10% 10%,#e0edf5,transparent 35%),#f5f7fb}.login-wrap{width:min(100%,440px)}.login-card{background:white;border:1px solid #e0e7ef;border-radius:24px;padding:32px;box-shadow:0 18px 60px #0b1f3a10}.login-card h1{font:800 29px var(--display);letter-spacing:-1px;margin:24px 0 9px}.login-card p{font-size:12px;line-height:1.7;color:#718198}.login-card label{display:block;font-size:11px;font-weight:700;margin:18px 0 7px}.login-card input{width:100%;padding:13px;border:1px solid #dce4ee;border-radius:11px;background:#fbfcfe}.login-card .button{margin-top:17px}.login-message{min-height:20px;font-size:11px;color:#087e8b}.login-message.error{color:#b42318}.login-foot{text-align:center;font-size:10px;color:#8190a4;margin-top:20px}.login-foot a{color:#53677e}</style></head>
<body><main class="login-wrap"><a class="brand" href="/"><span class="brand-mark">✚</span><span>Disaster<span class="brand-light">Guard</span><small>EMERGENCY RESPONSE NETWORK</small></span></a><section class="login-card"><div class="eyebrow muted">SECURE ACCESS</div><h1 id="title">Welcome back.</h1><p id="subtitle">Sign in with your email. We’ll send you a one-time code — no password required.</p><form id="loginForm"><div id="emailRow"><label for="email">Email address</label><input id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required></div><div id="codeRow" hidden><label for="code">6-digit sign-in code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div><button class="button button-primary full" id="submit" type="submit">Continue with email <span>→</span></button><button class="text-button" id="back" type="button" hidden>Use a different email</button></form><p class="login-message" id="message" role="status"></p><div class="login-foot">Secure passwordless access · <a href="/">Return to home</a></div></section></main>
<script>
(function(){const A=window.hatchable&&window.hatchable.auth;const $=id=>document.getElementById(id);let step='email';let hasPasskey=false;function next(){const raw=new URLSearchParams(location.search).get('next')||'/';return raw.startsWith('/')&&!raw.startsWith('//')&&!raw.includes('\\')&&!/[\u0000-\u001f\u007f]/.test(raw)?raw:'/'}function say(t,err){$('message').textContent=t;$('message').className='login-message'+(err?' error':'')}if(!A){say('Secure sign-in is unavailable. Refresh the page and try again.',true);$('submit').disabled=true;return}window.hatchable.auth.getSession().then(s=>{if(s&&s.user)location.replace(next())}).catch(()=>{});$('back').addEventListener('click',()=>{step='email';$('codeRow').hidden=true;$('email').parentElement.hidden=false;$('back').hidden=true;$('submit').textContent='Continue with email →';$('title').textContent='Welcome back.';$('subtitle').textContent='Sign in with your email. We will send you a one-time code — no password required.';say('')});$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submit');btn.disabled=true;try{if(step==='email'){const result=await A.startLogin({email:$('email').value.trim()});hasPasskey=!!(result&&result.has_passkey);if(hasPasskey&&A.supportsPasskeys&&A.supportsPasskeys()){try{const p=await A.signInWithPasskey({email:$('email').value.trim()});if(p&&p.user){location.replace(next());return}}catch(e){}}step='code';$('email').parentElement.hidden=true;$('codeRow').hidden=false;$('back').hidden=false;$('submit').textContent='Verify and sign in →';$('title').textContent='Check your email.';$('subtitle').textContent='Enter the 6-digit code sent to '+$('email').value.trim()+'.';say('Code sent. Check your inbox.');$('code').focus()}else{const result=await A.verifyCode({email:$('email').value.trim(),code:$('code').value.trim()});if(result&&result.user){if(!hasPasskey&&!localStorage.getItem('passkey_offer_declined')&&A.supportsPasskeys&&A.supportsPasskeys()){const offer=confirm('Add a passkey for faster sign-in next time? You can use your fingerprint, face, or device screen lock.');if(offer){try{await A.registerPasskey({name:'DisasterGuard device'})}catch(e){}}else localStorage.setItem('passkey_offer_declined','1')}location.replace(next());return}throw new Error('The code could not be verified. Try again.')}}catch(err){say(err&&err.status===429?'Too many attempts. Please wait and try again.':(err&&err.message||'Sign-in failed. Please try again.'),true)}finally{btn.disabled=false}})})();
</script></body></html>
